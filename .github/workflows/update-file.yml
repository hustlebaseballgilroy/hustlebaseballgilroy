name: Update File

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # lets you run it by hand from the Actions tab

# Needed so the job can push updated ICS files. The organization's default
# GITHUB_TOKEN is read-only, so grant write access to repo contents here.
permissions:
  contents: write

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      # GameChanger team calendar links (from the GameChanger app: team > gear >
      # Schedule Sync). Each team has its own teamId and private token; tokens are
      # stored as repo secrets. Update these when new season teams are created.
      #
      # File names are from last season and are kept so the Schedule page keeps
      # working: hustle-10u.ics = the 11U team, hustle-11u.ics = the 12U team.
      - name: Download 12U ICS file (saved as hustle-11u.ics)
        run: |
          curl -sSf -o hustle-11u-temp.ics "https://api.team-manager.gc.com/ics-calendar-documents/user/9eeb60a3-c8fb-4fde-9f2c-a59e214e1109.ics?teamId=a872b0bc-dacd-4b16-8b8d-08202e6610f4&token=${{ secrets.GC_CAL_TOKEN_12U }}"

      - name: Download 11U ICS file (saved as hustle-10u.ics)
        run: |
          curl -sSf -o hustle-10u-temp.ics "https://api.team-manager.gc.com/ics-calendar-documents/user/9eeb60a3-c8fb-4fde-9f2c-a59e214e1109.ics?teamId=69e67ba1-584f-4da5-a6ed-a14a6b7d250c&token=${{ secrets.GC_CAL_TOKEN_11U }}"

      - name: Make sure both calendars downloaded
        run: |
          for f in hustle-11u-temp.ics hustle-10u-temp.ics; do
            grep -q "BEGIN:VCALENDAR" "$f" || { echo "$f is not a calendar, keeping the old file"; exit 1; }
          done
      
      - name: Remove DTSTAMP from 11U ICS
        run: sed -i '/^DTSTAMP:/d' hustle-11u-temp.ics
      
      - name: Remove DTSTAMP from 10U ICS
        run: sed -i '/^DTSTAMP:/d' hustle-10u-temp.ics
      
      - name: Commit and push changes
        run: |
          update_needed=false
          if [ ! -f hustle-11u.ics ] || ! cmp --silent hustle-11u-temp.ics hustle-11u.ics; then
            echo "11U ICS file changed"
            mv hustle-11u-temp.ics hustle-11u.ics
            update_needed=true
          else
            rm hustle-11u-temp.ics
          fi
          if [ ! -f hustle-10u.ics ] || ! cmp --silent hustle-10u-temp.ics hustle-10u.ics; then
            echo "10U ICS file changed"
            mv hustle-10u-temp.ics hustle-10u.ics
            update_needed=true
          else
            rm hustle-10u-temp.ics
          fi
          if [ "$update_needed" = true ]; then
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git add hustle-11u.ics hustle-10u.ics
            git commit -m "Update team calendars from GameChanger"
            git push
          else
            echo "No ICS updates needed."
          fi
